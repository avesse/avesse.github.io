<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>John Murray — CV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #111;
      --border: #222;
      --text: #e0e0e0;
      --muted: #777;
      --accent: #7dd3fc;
      --sidebar-w: 240px;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #fafaf7;
        --surface: #f3f1ed;
        --border: #d8d4cc;
        --text: #1a1a1a;
        --muted: #6b6b6b;
        --accent: #0e7490;
      }
    }

    :root[data-theme="dark"] {
      --bg: #0d0d0d;
      --surface: #111;
      --border: #222;
      --text: #e0e0e0;
      --muted: #777;
      --accent: #7dd3fc;
    }

    :root[data-theme="light"] {
      --bg: #fafaf7;
      --surface: #f3f1ed;
      --border: #d8d4cc;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --accent: #0e7490;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.75;
    }

    /* ── Sidebar ── */
    #sidebar {
      position: fixed;
      top: 0; left: 0;
      width: var(--sidebar-w);
      height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 50;
      overflow-y: auto;
    }

    .nav-brand {
      padding: 1.75rem 1.5rem 1rem;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .nav-brand a {
      color: var(--accent);
      text-decoration: none;
    }

    .nav-list {
      list-style: none;
      flex: 1;
      padding: 0.5rem 0;
    }

    .nav-link {
      display: block;
      padding: 0.45rem 1.5rem;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.03em;
      border-left: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--accent);
      border-left-color: var(--accent);
    }

    .nav-downloads {
      padding: 1.25rem 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .nav-downloads a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      transition: color 0.15s;
    }

    .nav-downloads a:hover { color: var(--accent); }

    .theme-toggle {
      background: none;
      border: none;
      border-top: 1px solid var(--border);
      padding: 1rem 1.5rem;
      font-family: inherit;
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      color: var(--muted);
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: color 0.15s;
    }

    .theme-toggle:hover { color: var(--accent); }

    .theme-icon {
      font-size: 0.95rem;
      line-height: 1;
    }

    /* ── Main ── */
    #main {
      margin-left: var(--sidebar-w);
    }

    .content-wrap {
      max-width: 760px;
      padding: 3rem 4rem;
    }

    /* ── Sections ── */
    section {
      padding-bottom: 4rem;
      margin-bottom: 4rem;
      border-bottom: 1px solid var(--border);
    }

    section:last-child {
      border-bottom: none;
      padding-bottom: 8rem;
    }

    /* ── Typography ── */
    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    .title-suffix {
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.03em;
      text-transform: none;
    }

    h2 {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text);
      margin: 2.5rem 0 0.2rem;
    }

    h2 .role {
      font-weight: 300;
      color: var(--muted);
    }

    h3 {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin: 2rem 0 0.6rem;
    }

    .period {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    p {
      font-size: 0.85rem;
      margin-bottom: 0.85rem;
    }

    ul {
      padding-left: 1.25rem;
      margin-bottom: 0.85rem;
    }

    li {
      font-size: 0.85rem;
      margin-bottom: 0.2rem;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    /* ── Tables ── */
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 0.5rem 0 2rem;
    }

    table th {
      text-align: left;
      color: var(--muted);
      font-weight: 400;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.3rem 1.5rem 0.3rem 0;
      width: 8rem;
      white-space: nowrap;
      vertical-align: top;
    }

    table td {
      font-size: 0.8rem;
      color: var(--text);
      padding: 0.3rem 0;
      vertical-align: top;
    }

    /* ── Blockquotes ── */
    blockquote {
      border-left: 2px solid var(--accent);
      padding: 0.25rem 0 0.25rem 1.25rem;
      margin: 0.75rem 0 2rem;
    }

    blockquote p {
      color: var(--muted);
      font-style: italic;
      font-size: 0.8rem;
      line-height: 1.85;
      margin-bottom: 0.6rem;
    }

    blockquote p:last-child { margin-bottom: 0; }

    /* ── Burger ── */
    .burger {
      display: none;
      position: fixed;
      top: 1rem; right: 1rem;
      z-index: 200;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.6rem;
      cursor: pointer;
      flex-direction: column;
      gap: 4px;
    }

    .burger span {
      display: block;
      width: 18px;
      height: 1px;
      background: var(--text);
      transition: opacity 0.2s;
    }

    /* ── Overlay ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 40;
    }

    .overlay.visible { display: block; }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      .burger { display: flex; }

      #sidebar {
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        z-index: 100;
      }

      #sidebar.open { transform: translateX(0); }

      #main { margin-left: 0; }

      .content-wrap { padding: 2rem 1.5rem; }
    }

    /* ── Print ── (PDF generation forces light theme + compact layout) */
    @media print {
      :root, :root[data-theme="dark"], :root[data-theme="light"] {
        --bg: #ffffff;
        --surface: #ffffff;
        --border: #d8d4cc;
        --text: #1a1a1a;
        --muted: #555;
        --accent: #0e7490;
      }

      .burger, #sidebar, .overlay { display: none !important; }
      #main { margin-left: 0; }
      .content-wrap { padding: 0; max-width: 100%; }

      body { font-size: 9pt; line-height: 1.4; }

      section {
        padding-bottom: 0;
        margin-bottom: 0.35rem;
        border-bottom: none;
      }
      section:last-child { padding-bottom: 0; }

      h1 {
        color: #111;
        font-size: 0.95rem;
        margin: 0 0 0.7rem;
      }

      /* H2 keeps a touch of padding below */
      h2 { font-size: 0.85rem; margin: 0.45rem 0 0.25rem; }
      h3 { font-size: 0.72rem; margin: 0.55rem 0 0.15rem; color: --var(--text); }

      /* Body paragraphs slightly smaller, with breathing room between */
      p { font-size: 0.78rem; margin-bottom: 0.32rem; }
      ul { margin-bottom: 0.32rem; padding-left: 1rem; margin-left: 1rem; margin-right: 1rem; }
      li { font-size: 0.78rem; margin-bottom: 0.03rem; }

      .period { margin-bottom: 0.15rem; font-size: 0.7rem; font-style: italic; }

      table { margin: 0.08rem 0 0.25rem; }
      table th, table td { padding: 0.06rem 1rem 0.06rem 0; font-size: 0.72rem; }
      table th { font-size: 0.62rem; }

      /* Testimonials larger, tightly packed */
      blockquote { margin: 0.8rem 0 0.8rem; padding: 0 0 0 0.85rem; }
      blockquote p { font-size: 0.8rem; line-height: 1.4; margin-bottom: 0.2rem; }

      /* Two-column lists in the intro to save space */
      #john-murray ul { columns: 2; column-gap: 1.5rem; }
      #john-murray h3 { margin-top: 0.7rem; }

      #career h1 { margin-top: 1.3rem; }

      #recent-projects h2 { margin-top: 1.1rem; }
      #recent-projects p { font-size: 0.72rem; margin-bottom: 0.5rem; }

      a { color: #111; }

      table, blockquote { page-break-inside: avoid; }
      h2, h3 { page-break-after: avoid; }

      /* Each major section starts a new page (intro+career flow together) */
      #recent-projects { page-break-before: always; }
      #testimonials { page-break-before: always; }

      @page { size: A4; margin: 1.6cm 1.8cm; }
    }
  </style>
</head>
<body>

<button class="burger" id="burger" aria-label="Open navigation" aria-expanded="false">
  <span></span><span></span><span></span>
</button>

<div class="overlay" id="overlay"></div>

<nav id="sidebar">
  <div class="nav-brand"><a href="/">avesse.net</a></div>
  <ul class="nav-list">
{{NAV}}
  </ul>
  <div class="nav-downloads">
    <a href="john-murray-cv.md" download>cv.md ↓</a>
    <a href="john-murray-cv.pdf" download>cv.pdf ↓</a>
  </div>
  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
    <span class="theme-icon">◐</span>
    <span class="theme-label">light</span>
  </button>
</nav>

<main id="main">
  <div class="content-wrap">
{{CONTENT}}
  </div>
</main>

<script>
  const burger = document.getElementById('burger');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');

  function openNav() {
    sidebar.classList.add('open');
    overlay.classList.add('visible');
    burger.setAttribute('aria-expanded', 'true');
  }

  function closeNav() {
    sidebar.classList.remove('open');
    overlay.classList.remove('visible');
    burger.setAttribute('aria-expanded', 'false');
  }

  burger.addEventListener('click', () => sidebar.classList.contains('open') ? closeNav() : openNav());
  overlay.addEventListener('click', closeNav);
  document.querySelectorAll('.nav-link').forEach(l => l.addEventListener('click', closeNav));

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        const link = document.querySelector('.nav-link[href="#' + entry.target.id + '"]');
        if (link) link.classList.add('active');
      }
    });
  }, { rootMargin: '-10% 0px -60% 0px', threshold: 0 });

  document.querySelectorAll('section[id]').forEach(s => observer.observe(s));

  // ── Theme toggle ──
  const THEME_KEY = 'theme';
  const themeToggle = document.getElementById('theme-toggle');
  const themeLabel = themeToggle.querySelector('.theme-label');

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeLabel.textContent = theme === 'dark' ? 'light' : 'dark';
  }

  function effectiveTheme() {
    const stored = localStorage.getItem(THEME_KEY);
    if (stored === 'dark' || stored === 'light') return stored;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  applyTheme(effectiveTheme());

  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    localStorage.setItem(THEME_KEY, next);
    applyTheme(next);
  });

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
    if (!localStorage.getItem(THEME_KEY)) {
      applyTheme(e.matches ? 'dark' : 'light');
    }
  });
</script>

</body>
</html>
